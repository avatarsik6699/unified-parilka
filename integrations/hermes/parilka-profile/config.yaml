# Parilka228 Hermes profile — config.yaml
# See operations/HERMES.md for the operator setup and bootstrap procedure.
# This file contains no secret values; all credentials live in .env.

_config_version: 33

# ── Model ──────────────────────────────────────────────────────────────────
model:
  default: "deepseek-v4-flash-0731"
  provider: "qwen-token-plan"
  base_url: ""

# ── Named providers ────────────────────────────────────────────────────────
providers:
  qwen-token-plan:
    api: "https://token-plan.ap-southeast-1.maas.aliyuncs.com/apps/anthropic"
    base_url: "https://token-plan.ap-southeast-1.maas.aliyuncs.com/compatible-mode/v1"
    name: "Qwen token plan"
    key_env: "ALIBABA_TOKEN_PLAN_API_KEY"
    transport: "anthropic_messages"
    default_model: "deepseek-v4-flash-0731"
    model: "deepseek-v4-flash-0731"
    context_length: 1048576
    discover_models: false
    models:
      deepseek-v4-flash-0731: {}
      deepseek-v4-pro: {}

# ── Agent ──────────────────────────────────────────────────────────────────
agent:
  max_turns: 500
  reasoning_effort: "max"
  verify_on_stop: false
  disabled_toolsets:
    - bfl
    - clarify
    - code_execution
    - computer_use
    - context_engine
    - cronjob
    - discord
    - discord_admin
    - feishu_doc
    - feishu_drive
    - file
    - homeassistant
    - image_gen
    - kanban
    - project
    - spotify
    # stt below refers to the model toolset resolver; it does NOT disable
    # root stt.enabled / Flov gateway transcription.
    - stt
    - telegram-parilka
    - terminal
    - todo
    - tts
    - video
    - video_gen
    - x_search
    - yuanbao

# ── Tools ──────────────────────────────────────────────────────────────────
tools:
  tool_search:
    enabled: "off"

# ── Auxiliary models ───────────────────────────────────────────────────────
auxiliary:
  vision:
    provider: "openai-codex"
    model: "gpt-5.6-luna"
  # Group sessions do not need generated sidebar titles. The custom
  # Anthropic-transport endpoint has no OpenAI-compatible /v1 title route,
  # so disabling this also avoids a pointless 404 after the first reply.
  title_generation:
    enabled: false
  web_extract:
    provider: "qwen-token-plan"
    model: "deepseek-v4-flash-0731"
  compression:
    provider: "qwen-token-plan"
    model: "deepseek-v4-flash-0731"

# ── Compression ────────────────────────────────────────────────────────────
compression:
  enabled: true

# ── Memory ─────────────────────────────────────────────────────────────────
memory:
  memory_enabled: true
  user_profile_enabled: false
  memory_char_limit: 8000
  # nudge_interval: 0 — напоминания о записи в память отключены.
  nudge_interval: 0
  # write_approval: false means writes flow through immediately (no staging).
  write_approval: false

# ── Skills ─────────────────────────────────────────────────────────────────
skills:
  write_approval: false
  guard_agent_created: false
  creation_nudge_interval: 10

# ── Gateway ────────────────────────────────────────────────────────────────
group_sessions_per_user: false
max_concurrent_sessions: null

streaming:
  enabled: false

# ── Display ────────────────────────────────────────────────────────────────
display:
  streaming: false
  busy_input_mode: queue
  interim_assistant_messages: true
  long_running_notifications: true
  busy_ack_detail: false
  tool_progress: "off"
  # Native runtime footer показывает %, не наш формат — выключен намеренно;
  # точный footer добавляет плагин parilka_chat (runtime_hooks.py).
  runtime_footer:
    enabled: false
  platforms:
    telegram:
      streaming: false
      busy_input_mode: queue
      interim_assistant_messages: true
      # Live tool-call progress accumulates in one editable Telegram message
      # and is cleaned up only after the final answer is delivered.
      tool_progress: "all"
      tool_progress_grouping: accumulate
      cleanup_progress: true
      busy_ack_detail: false

# ── Tool loop guardrails ───────────────────────────────────────────────────
tool_loop_guardrails:
  warnings_enabled: false
  hard_stop_enabled: false
  loop_caps:
    max_web_searches: 0
    max_subagents: 0

# ── Telegram ───────────────────────────────────────────────────────────────
telegram:
  require_mention: true
  observe_unmentioned_group_messages: false
  exclusive_bot_mentions: true
  reply_to_mode: "first"
  gateway_restart_notification: false
  allowed_chats: ["-1003179772905"]
  group_allowed_chats: ["-1003179772905"]
  unauthorized_dm_behavior: "ignore"
  extra:
    # Native Hermes option: slash-command menu and dispatch are disabled.
    # Mention chat is unaffected — it is governed by require_mention above.
    commands_enabled: false

# ── Platform toolsets ──────────────────────────────────────────────────────
platform_toolsets:
  telegram:
    - parilka_chat
    - memory
    - skills
    - web
    - vision
    - session_search
    - delegation

# ── STT ────────────────────────────────────────────────────────────────────
stt:
  enabled: true
  provider: "openai"
  language: "ru"
  use_gateway: false
  openai:
    model: "flov-whisper"
    language: ""
    base_url: "http://127.0.0.1:17432/v1"
    api_key: "flov-local"

# ── Known plugin toolsets ──────────────────────────────────────────────────
known_plugin_toolsets:
  telegram:
    - parilka_chat
    - spotify

# ── MCP servers ────────────────────────────────────────────────────────────
mcp_servers:
  telegram-parilka:
    command: "/home/billy/repos/parilka-unified/bin/telegram-parilka-mcp"
    env:
      PARILKA_MCP_HTTP_URL: "http://127.0.0.1:8766/mcp"
    tools:
      include:
        - rag_bm25_search
        - keyword_search
        - read_chat_slice
        - day_digest
        - thread_context

# ── Web search/extract ─────────────────────────────────────────────────────
web:
  search_backend: "searxng"
  extract_backend: "firecrawl"

# ── Plugins ────────────────────────────────────────────────────────────────
plugins:
  enabled:
    - parilka-chat
  entries:
    parilka-chat:
      enabled: true
